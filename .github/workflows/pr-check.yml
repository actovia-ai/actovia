name: PR Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

# Least-privilege default: neither job needs more than read access to the repo.
permissions:
  contents: read

# A new push to a PR (or a dependabot rebase) makes the previous run moot.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source-level gates. None of them depends on the OS, so one runner is enough.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Translation catalogs
        run: bun run i18n:check

      - name: Test
        run: bun run test

  # Installers on every OS, with the same command the release workflow runs, so
  # a packaging problem (a wrong binary name for the deb, a missing icon, …)
  # fails the PR instead of the release after the merge.
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # macos-26, not -latest: packaging compiles build/icon.icon (the Icon
        # Composer app icon) with actool, which needs macOS 26 + Xcode 26 and
        # fails the build rather than falling back to the .icns.
        include:
          - os: macos-26
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    env:
      npm_config_arch: ${{ matrix.arch }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Forge's deb / rpm makers shell out to dpkg+fakeroot and rpmbuild.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build distributables
        run: bun run make --arch=${{ matrix.arch }}

      - name: Verify packaged runtime architecture
        if: matrix.platform != 'darwin'
        run: node scripts/verify-package-architecture.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: test-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/**/*.exe
            out/make/**/*.dmg
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error
