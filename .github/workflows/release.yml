name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  # bun install runs `prepare: husky`; nothing here should touch git hooks.
  HUSKY: 0

jobs:
  # Ask semantic-release (dry run) what the next version would be. Empty when
  # the commits since the last tag don't warrant a release — the jobs below
  # are then skipped instead of failing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run --no-ci | tee "$RUNNER_TEMP/next-release.log"
          NEXT_VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/next-release.log" || true)
          echo "Next version: ${NEXT_VERSION:-<none — nothing to release>}"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one OS must not cancel the others mid-install: the first
      # run of this workflow lost the macOS and Windows results that way.
      fail-fast: false
      matrix:
        # macos-26, not -latest: packaging compiles build/icon.icon (the Icon
        # Composer app icon) with actool, which needs macOS 26 + Xcode 26 and
        # fails the build rather than falling back to the .icns.
        include:
          - os: macos-26
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
          # Keep the x64 and ARM64 Linux packaging baseline aligned (glibc/RPM).
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    # Windows runners default to PowerShell, where `$NEXT_VERSION` is not the
    # environment variable (that is `$env:NEXT_VERSION`): the "Set package
    # version" step below died on it ("The variable '$NEXT_VERSION' cannot be
    # retrieved because it has not been set"). One shell everywhere keeps the
    # steps portable; Git Bash ships on the Windows runners.
    defaults:
      run:
        shell: bash

    # macOS signing and notarization (ISSUE-82) run only when their secrets
    # are set; without them the build is ad-hoc as before (forge.config.ts).
    #   MACOS_CERTIFICATE           the Developer ID Application .p12, base64
    #   MACOS_CERTIFICATE_PASSWORD  its export password
    #   APPLE_API_KEY_P8            an App Store Connect API key (.p8 contents)
    #   APPLE_API_KEY_ID / APPLE_API_ISSUER  that key's id and issuer
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      npm_config_arch: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Forge's deb / rpm makers shell out to dpkg+fakeroot and rpmbuild.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot rpm

      - run: bun install --frozen-lockfile

      # Host-native installs pull the matching DuckDB and agent helper binaries.
      # A wrong runner architecture must fail here, not ship an emulated build.
      - name: Verify native runtime architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Runner architecture mismatch: ' + process.arch)"
          node -e "require('@duckdb/node-api')"

      # appdmg loads host-Node addons, not Electron runtime addons.
      # Load the whole engine before packaging/signing to verify their builds.
      - name: Verify macOS DMG native dependencies
        if: matrix.os == 'macos-26'
        run: node -e "require('appdmg')"

      - name: Verify Windows Squirrel archive dependencies
        if: matrix.platform == 'win32' && matrix.arch == 'x64'
        run: |
          node <<'NODE'
          const { accessSync } = require('node:fs');
          const { dirname, join } = require('node:path');
          const root = dirname(require.resolve('electron-winstaller/package.json'));
          for (const file of ['7z.exe', '7z.dll']) accessSync(join(root, 'vendor', file));
          NODE

      - name: Prepare Windows signing certificate
        if: matrix.platform == 'win32' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          printf '%s' "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/windows-signing.pfx"
          echo "WINDOWS_CERTIFICATE_FILE=$(cygpath -w "$RUNNER_TEMP/windows-signing.pfx")" >> "$GITHUB_ENV"

      # The version lives in package.json, which is what the makers stamp into
      # the installers; semantic-release commits the real bump afterwards.
      - name: Set package version
        env:
          NEXT_VERSION: ${{ needs.version.outputs.version }}
        run: npm pkg set version="$NEXT_VERSION"

      # A keychain of the job's own holds the certificate; the identity it
      # contains becomes APPLE_SIGNING_IDENTITY, which turns osxSign on.
      - name: Import the Developer ID certificate
        if: matrix.os == 'macos-26' && env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # The intermediates the certificate may chain through (the original
          # Developer ID CA and G2), so codesign can build the chain on a runner.
          for CA in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$CA.cer" -o "$RUNNER_TEMP/$CA.cer"
            security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN" || true
          done
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Not `-v`: the code-signing policy reports this certificate as not
          # valid although codesign signs with it, and under pipefail a grep
          # that matches nothing ends the step without a word.
          IDENTITIES="$(security find-identity -p codesigning "$KEYCHAIN")"
          IDENTITY="$(printf '%s\n' "$IDENTITIES" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"' || true)"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in the certificate. The keychain holds:" >&2
            printf '%s\n' "$IDENTITIES" | sed -E 's/[0-9A-F]{40}/<sha1>/' >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare the notarization key
        if: matrix.os == 'macos-26' && env.HAS_MAC_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # `make` = electron-forge make with data-testid stripped (see package.json).
      # Output: macOS ZIP + DMG (+ latest-mac.yml and the zip's .blockmap,
      # electron-updater's feed — forge.config.ts postMake), Windows NSIS (x64/ARM64)
      # plus the legacy x64 Squirrel feed (.exe/.nupkg/RELEASES),
      # Linux .deb + .rpm — all under out/make/. The macOS build is signed and
      # notarized when the steps above ran, ad-hoc otherwise.
      - name: Build distributables
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: bun run make --arch=${{ matrix.arch }}

      - name: Verify packaged runtime architecture
        if: matrix.platform != 'darwin'
        run: node scripts/verify-package-architecture.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Verify Windows signatures
        if: matrix.platform == 'win32' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem out/make -Recurse -Filter *.exe
          if (!$files) { throw 'No Windows installers generated' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($file.Name) ($($signature.Status))" }
          }

      - name: Remove Windows signing certificate
        if: always() && matrix.platform == 'win32' && env.HAS_WINDOWS_CERT == 'true'
        run: rm -f "$RUNNER_TEMP/windows-signing.pfx"

      - name: Remove the signing keychain
        if: always() && matrix.os == 'macos-26' && env.HAS_MAC_CERT == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-artifacts-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/**/*.zip
            out/make/**/*.zip.blockmap
            out/make/**/latest-mac.yml
            out/make/**/*.dmg
            out/make/**/*.exe
            out/make/**/*.exe.blockmap
            out/make/**/latest.yml
            out/make/**/latest-arm64.yml
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    # semantic-release's @semantic-release/git plugin makes the version-bump
    # commit; with HUSKY=0 (set for the whole workflow above) the pre-commit
    # hook doesn't re-run lint-staged/typecheck on it. The gate already ran on
    # the PR.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Never silently overwrite an architecture's feed or installer.
          while IFS= read -r -d '' asset; do
            name=$(basename "$asset")
            if [ -e "release-assets/$name" ]; then
              echo "Duplicate release asset: $name" >&2
              exit 1
            fi
            cp "$asset" "release-assets/$name"
          done < <(find all-artifacts -type f -not -path "*/\.*" -print0)
          # `actovia app update` refuses a download these do not vouch for.
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          ls -la release-assets

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          draft: false
          files: |
            release-assets/*
