name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  # bun install runs `prepare: husky`; nothing here should touch git hooks.
  HUSKY: 0

jobs:
  # Ask semantic-release (dry run) what the next version would be. Empty when
  # the commits since the last tag don't warrant a release — the jobs below
  # are then skipped instead of failing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_VERSION=$(npx semantic-release --dry-run --no-ci | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "Next version: ${NEXT_VERSION:-<none — nothing to release>}"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one OS must not cancel the others mid-install: the first
      # run of this workflow lost the macOS and Windows results that way.
      fail-fast: false
      matrix:
        # macos-26, not -latest: packaging compiles build/icon.icon (the Icon
        # Composer app icon) with actool, which needs macOS 26 + Xcode 26 and
        # fails the build rather than falling back to the .icns.
        os: [macos-26, windows-latest, ubuntu-latest]

    # Windows runners default to PowerShell, where `$NEXT_VERSION` is not the
    # environment variable (that is `$env:NEXT_VERSION`): the "Set package
    # version" step below died on it ("The variable '$NEXT_VERSION' cannot be
    # retrieved because it has not been set"). One shell everywhere keeps the
    # steps portable; Git Bash ships on the Windows runners.
    defaults:
      run:
        shell: bash

    # macOS signing and notarization (ISSUE-82) run only when their secrets
    # are set; without them the build is ad-hoc as before (forge.config.ts).
    #   MACOS_CERTIFICATE           the Developer ID Application .p12, base64
    #   MACOS_CERTIFICATE_PASSWORD  its export password
    #   APPLE_API_KEY_P8            an App Store Connect API key (.p8 contents)
    #   APPLE_API_KEY_ID / APPLE_API_ISSUER  that key's id and issuer
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Forge's deb / rpm makers shell out to dpkg+fakeroot and rpmbuild.
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot rpm

      - run: bun install --frozen-lockfile

      # The version lives in package.json, which is what the makers stamp into
      # the installers; semantic-release commits the real bump afterwards.
      - name: Set package version
        env:
          NEXT_VERSION: ${{ needs.version.outputs.version }}
        run: npm pkg set version="$NEXT_VERSION"

      # A keychain of the job's own holds the certificate; the identity it
      # contains becomes APPLE_SIGNING_IDENTITY, which turns osxSign on.
      - name: Import the Developer ID certificate
        if: matrix.os == 'macos-26' && env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate" >&2; exit 1; fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare the notarization key
        if: matrix.os == 'macos-26' && env.HAS_MAC_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # `make` = electron-forge make with data-testid stripped (see package.json).
      # Output: macOS ZIP + DMG, Windows Squirrel (.exe/.nupkg/RELEASES),
      # Linux .deb + .rpm — all under out/make/. The macOS build is signed and
      # notarized when the steps above ran, ad-hoc otherwise.
      - name: Build distributables
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run make

      - name: Remove the signing keychain
        if: always() && matrix.os == 'macos-26' && env.HAS_MAC_CERT == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-artifacts-${{ matrix.os }}
          path: |
            out/make/**/*.zip
            out/make/**/*.dmg
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    # semantic-release's @semantic-release/git plugin makes the version-bump
    # commit; with HUSKY=0 (set for the whole workflow above) the pre-commit
    # hook doesn't re-run lint-staged/typecheck on it. The gate already ran on
    # the PR.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -not -path "*/\.*" | xargs -I {} cp {} release-assets/
          # `actovia app update` refuses a download these do not vouch for.
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          ls -la release-assets

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          draft: false
          files: |
            release-assets/*
