name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege default: neither job needs more than read access to the repo.
permissions:
  contents: read

jobs:
  api-tests:
    name: API Integration Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build app
        # `package` builds the production bundles into .vite/ (main, preload,
        # renderer) — what `electron .` below runs, via package.json's `main`.
        run: bun run package
      - name: Start app in background
        # ubuntu-latest ships with xvfb preinstalled. --no-sandbox is required
        # because GitHub-hosted runners don't support Chromium's setuid-sandbox
        # helper. nohup keeps the process alive once this step exits so the
        # next step can talk to its Hono server.
        run: |
          nohup xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            ./node_modules/.bin/electron . --no-sandbox \
            > /tmp/electron.log 2>&1 &
          # Poll until the Hono server is reachable instead of `sleep 10` —
          # surfaces "electron didn't start" as a real failure with logs.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:60223/api/settings > /dev/null; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start within 60s" >&2
          echo "--- /tmp/electron.log ---" >&2
          cat /tmp/electron.log >&2 || true
          exit 1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_CLOUD: ${{ secrets.GOOGLE_CLOUD }}
          ACTOVIA_DISABLE_AUTO_UPDATE: '1'
      - name: Run API tests
        run: bun run test:e2e:api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_CLOUD: ${{ secrets.GOOGLE_CLOUD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 30
      - name: Upload electron log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-log
          path: /tmp/electron.log
          retention-days: 7

  e2e-tests:
    name: Electron E2E Tests
    timeout-minutes: 30
    # macos-26: the e2e build packages first, and packaging compiles
    # build/icon.icon with actool (macOS 26 + Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run E2E tests
        # Packages first (production bundles into .vite/), then drives the
        # unpackaged app through Playwright — see tests/fixtures/electron.ts.
        run: bun run test:e2e:electron
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 30
