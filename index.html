    <style>
      /*
        Cold-boot splash: pure CSS/HTML, no JS dependency, so it paints
        before the module graph (React included) has loaded. Lives inside
        #root so React's first `createRoot(...).render(...)` commit clears
        it automatically — no explicit teardown code needed. No background
        of its own — the window is `transparent: true` with macOS
        `vibrancy: 'sidebar'` (see main/lib/window.ts) and globals.css keeps
        `body` at `bg-transparent` for that reason; painting an opaque
        background here would blank out the vibrancy effect during boot.
        The splash itself (Ody walking in with the bindle, hopping, blinking,
        three loading dots) is generated between the boot-splash markers by
        `bun run icons` from brand/art.mjs — edit it there, not here. It
        animates only transform/opacity, which run on the compositor, so it
        keeps moving while the main thread evaluates the module graph. Dot
        colors are hardcoded (not var(--foreground) etc.) because globals.css isn't
        guaranteed to have applied yet; keep in sync with the `:root`/`.dark`
        tokens in assets/stylesheets/globals.css. Only
        follows prefers-color-scheme (not the in-app theme override stored
        in localStorage) — a user who overrides their OS theme may see one
        mismatched frame here before ThemeProvider corrects it.
      */
      html,
      body {
        margin: 0;
      }
      /* boot-splash:start — generated by `bun run icons` (brand/art.mjs) */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      #boot-splash .bs-icon {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 22.4%;
        overflow: hidden;
        box-shadow:
          0 8px 24px rgb(0 0 0 / 16%),
          0 1px 2px rgb(0 0 0 / 12%);
        animation: bs-rise 500ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #boot-splash .bs-layer {
        position: absolute;
        inset: 0;
      }
      /* The bundle swings past its layer's box; the icon's rounded clip
         trims what leaves the icon, so the layers must not clip. */
      #boot-splash svg {
        display: block;
        overflow: visible;
      }
      /* Ody walks in from the left, then keeps hopping on the spot with the
         bundle swinging, and the shadow shrinking as it leaves the ground. */
      #boot-splash .bs-enter {
        animation: bs-walk-in 700ms 120ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #boot-splash .bs-hop {
        animation: bs-hop 1100ms 820ms cubic-bezier(0.77, 0, 0.175, 1) infinite;
      }
      #boot-splash .bs-shadow {
        transform-origin: 50% 84%;
        animation: bs-shadow 1100ms 820ms cubic-bezier(0.77, 0, 0.175, 1)
          infinite;
      }
      #boot-splash .bs-bindle {
        transform-origin: 34% 58%;
        animation: bs-swing 1100ms 820ms cubic-bezier(0.77, 0, 0.175, 1)
          infinite;
      }
      #boot-splash .bs-eyes {
        transform-origin: 62% 51%;
        animation: bs-blink 3600ms 1400ms infinite;
      }
      #boot-splash .bs-dots {
        display: flex;
        gap: 6px;
      }
      #boot-splash .bs-dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: oklch(0.556 0 0);
        animation: bs-dot 1200ms cubic-bezier(0.77, 0, 0.175, 1) infinite both;
      }
      #boot-splash .bs-dots i:nth-child(2) {
        animation-delay: 150ms;
      }
      #boot-splash .bs-dots i:nth-child(3) {
        animation-delay: 300ms;
      }
      @keyframes bs-rise {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
      }
      @keyframes bs-walk-in {
        from {
          transform: translateX(-38%);
        }
      }
      @keyframes bs-hop {
        0%,
        100% {
          transform: none;
        }
        45% {
          transform: translateY(-5%);
        }
      }
      @keyframes bs-shadow {
        0%,
        100% {
          transform: none;
          opacity: 1;
        }
        45% {
          transform: scaleX(0.82);
          opacity: 0.6;
        }
      }
      @keyframes bs-swing {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(5deg);
        }
      }
      @keyframes bs-blink {
        0%,
        92%,
        100% {
          transform: none;
        }
        95% {
          transform: scaleY(0.12);
        }
      }
      @keyframes bs-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: none;
        }
        40% {
          opacity: 0.9;
          transform: translateY(-3px);
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash .bs-dots i {
          background: oklch(0.708 0 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-icon,
        #boot-splash .bs-enter,
        #boot-splash .bs-hop,
        #boot-splash .bs-shadow,
        #boot-splash .bs-bindle {
          animation: none;
        }
        #boot-splash .bs-dots i {
          transform: none;
        }
      }
      /* boot-splash:end */
    </style>
  </head>
